<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fontes vao no bundle (@fontsource-variable) — sem dependencia de CDN externo. -->
    <!-- Favicon v3.1 (§3): anel r11 #8B5CF6 .45 + EKG em #A55EFF. Sem hexágono, sem ponto. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Ccircle cx='16' cy='16' r='11' stroke='%238B5CF6' stroke-opacity='.45' stroke-width='1.6'/%3E%3Cpath d='M2 16 H10 l2 -3 l2.5 5.5 l3 -10 l3.5 12 l2.5 -7 l1.5 2.5 H30' stroke='%23A55EFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <meta name="description" content="Pulsar Finance — o pulso financeiro do seu negócio. DRE/DFC sobre dados Omie." />
    <title>PULSAR FINANCE</title>
  </head>
  <body>
    <!-- §4: escape explícito para congelar o movimento (?static=1). Roda ANTES do paint para
         não haver piscada. Nunca gatear em prefers-reduced-motion — no Windows/RDP ele liga
         sozinho e mata a animação do usuário real. -->
    <script>
      if (new URLSearchParams(location.search).get('static') === '1')
        document.documentElement.setAttribute('data-static', '')
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
